<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3EEE3">
  <title>Masuk | LAPOR PAK</title>
  <link rel="stylesheet" href="./assets/css/site.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
</head>
<body class="operator-login-page">
  <main class="login-card">
    <a class="site-brand" href="./index.html">LAPOR <span>PAK</span></a>
    <p class="map-eyebrow">RUANG PENGELOLA</p>
    <h1 id="auth-title">Masuk LAPOR PAK</h1>
    <p id="auth-description">Masuk untuk mengelola laporan dan progres perbaikan jalan.</p>
    <div class="operator-flash" id="auth-message" role="alert" hidden></div>
    <form id="auth-form" novalidate>
      <label class="map-field">Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label class="map-field">Kata sandi
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="operator-primary" id="submit-auth" type="submit">Masuk</button>
      <button class="operator-secondary" id="toggle-auth-mode" type="button">Buat akun masyarakat</button>
    </form>
    <a class="login-back" href="./index.html">← Kembali ke LAPOR PAK</a>
  </main>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
